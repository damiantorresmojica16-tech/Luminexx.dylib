    .container { max-width: 520px; width: 100%; text-align: center; margin-top: 30px; }
    .badge { background: rgba(124, 58, 237, 0.15); border: 1px solid #7c3aed; color: #c084fc; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 20px; font-weight: 600; }

    /* Ventana Modal de Key */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 1000; }

    .btn-submit { background: #7c3aed; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .close-btn { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #a1a1aa; font-size: 1.3rem; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 0.85rem; font-weight: bold; }
