<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminex iOS - Tool</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --accent: #ff6b00; /* Naranja Neón */
      --accent-hover: #e05d00;
      --text: #ffffff;
      --text-muted: #8a8d93;
      --error: #ff4d4d;
      --success: #20c997;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,107,0,0.2);
      text-align: center;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    /* Zona de carga de archivos */
    .file-dropzone {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      background: rgba(255,107,0,0.03);
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .file-dropzone:hover {
      background: rgba(255,107,0,0.08);
    }

    .file-dropzone input {
      display: none;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      background: #4a4d52;
      cursor: not-allowed;
    }

    /* Modal / Popup de Key */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--accent);
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0f12;
      color: #fff;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .msg {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Modal de Validación de Key -->
  <div id="modalKey" class="modal-overlay">
    <div class="modal-content">
      <h2>Acceso Requerido</h2>
      <p>Ingresa tu licencia/key generada desde el bot de Telegram para continuar.</p>
      <input type="text" id="inputKey" placeholder="WIDMAN-WEB-XXXX-XXXX" />
      <button id="btnValidarKey" class="btn" onclick="validarKey()">Ingresar</button>
      <div id="msgKey" class="msg"></div>
    </div>
  </div>

  <!-- Panel Principal de la Herramienta -->
  <div class="container">
    <h1>Luminex Tool</h1>
    <p>Sube tu archivo para aplicar las modificaciones automáticamente.</p>

    <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
      <span id="fileLabel">📁 Toca para seleccionar archivo</span>
      <input type="file" id="fileInput" onchange="actualizarNombreArchivo(this)" />
    </div>

    <button id="btnProcesar" class="btn" onclick="procesarArchivo()" disabled>Modificar y Descargar</button>
    <div id="msgStatus" class="msg"></div>
  </div>

  <script>
    // Tu API URL de Render ya agregada
    const API_URL = "https://luminexx-dylib.onrender.com";

    let keyGuardada = "";

    // 1. Validar la Key contra MongoDB (Render)
    async function validarKey() {
      const input = document.getElementById("inputKey");
      const btn = document.getElementById("btnValidarKey");
      const msg = document.getElementById("msgKey");
      const keyVal = input.value.trim();

      if (!keyVal) {
        msg.className = "msg error";
        msg.textContent = "Por favor escribe una Key válida.";
        return;
      }

      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Verificando en base de datos...";

      try {
        const response = await fetch(`${API_URL}/validar-key?key=${encodeURIComponent(keyVal)}`);
        const data = await response.json();

        if (data.valida) {
          msg.className = "msg success";
          msg.textContent = "¡Key correcta! Accediendo...";
          keyGuardada = keyVal;
          
          setTimeout(() => {
            document.getElementById("modalKey").classList.add("hidden");
          }, 800);
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "Key no válida o expirada.";
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Error al conectar con el servidor.";
        btn.disabled = false;
      }
    }

    // 2. Mostrar nombre del archivo seleccionado
    function actualizarNombreArchivo(input) {
      const label = document.getElementById("fileLabel");
      const btn = document.getElementById("btnProcesar");

      if (input.files && input.files[0]) {
        label.textContent = `📄 ${input.files[0].name}`;
        btn.disabled = false;
      } else {
        label.textContent = "📁 Toca para seleccionar archivo";
        btn.disabled = true;
      }
    }

    // 3. Enviar archivo a procesar
    async function procesarArchivo() {
      const fileInput = document.getElementById("fileInput");
      const btn = document.getElementById("btnProcesar");
      const msg = document.getElementById("msgStatus");

      if (!fileInput.files[0] || !keyGuardada) return;

      const formData = new FormData();
      formData.append("key", keyGuardada);
      formData.append("file", fileInput.files[0]);

      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Procesando archivo... Por favor espera.";

      try {
        const response = await fetch(`${API_URL}/modificar-archivo`, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || "Error al modificar archivo.");
        }

        // Convertir la respuesta a Blob y descargar
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `modificado_${fileInput.files[0].name}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        msg.className = "msg success";
        msg.textContent = "¡Archivo modificado y descargado con éxito!";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message || "Ocurrió un error inesperado.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
