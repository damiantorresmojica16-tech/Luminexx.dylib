<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminex Tool</title>
  <style>
    :root {
      --bg: #0b0d10;
      --card-bg: #13161c;
      --accent: #ff6b00;
      --accent-hover: #e05d00;
      --text: #ffffff;
      --text-muted: #8a8d93;
      --error: #ff4d4d;
      --success: #20c997;
      --border: rgba(255, 107, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 18px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .input-box {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2a2d34;
      background: #090a0c;
      color: #ffffff;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: #4a4d54;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn.active {
      background: var(--accent);
    }

    .btn.active:hover {
      background: var(--accent-hover);
    }

    .file-zone {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      cursor: pointer;
      background: rgba(255, 107, 0, 0.02);
    }

    .file-zone input {
      display: none;
    }

    .msg {
      margin-top: 18px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .msg.error { color: var(--error); }
    .msg.success { color: var(--success); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Vista 1: Entrada de Key -->
    <div id="viewKey">
      <h2>Acceso Requerido</h2>
      <p class="subtitle">Ingresa tu licencia/key generada desde el bot de Telegram para continuar.</p>
      
      <input type="text" id="inputKey" class="input-box" placeholder="WIDMAN-WEB-XXXX-XXXX" oninput="toggleBtnState()" />
      <button id="btnIngresar" class="btn" onclick="validarKey()">Ingresar</button>
      
      <div id="msgKey" class="msg"></div>
    </div>

    <!-- Vista 2: Subir Archivo (Oculta hasta validar key) -->
    <div id="viewTool" class="hidden">
      <h2>Luminex Tool</h2>
      <p class="subtitle">Sube tu archivo para aplicar la modificación automáticamente.</p>

      <div class="file-zone" onclick="document.getElementById('fileInput').click()">
        <span id="fileLabel">📁 Seleccionar archivo</span>
        <input type="file" id="fileInput" onchange="archivoSeleccionado(this)" />
      </div>

      <button id="btnProcesar" class="btn active" onclick="procesarArchivo()" disabled>Modificar y Descargar</button>
      <div id="msgTool" class="msg"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://luminexx-dylib.onrender.com";
    let keyGuardada = "";

    function toggleBtnState() {
      const val = document.getElementById("inputKey").value.trim();
      const btn = document.getElementById("btnIngresar");
      if (val.length > 0) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    async function validarKey() {
      const input = document.getElementById("inputKey");
      const btn = document.getElementById("btnIngresar");
      const msg = document.getElementById("msgKey");
      const keyVal = input.value.trim();

      if (!keyVal) return;

      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Verificando en base de datos...";

      try {
        const response = await fetch(`${API_URL}/validar-key?key=${encodeURIComponent(keyVal)}`);
        const data = await response.json();

        if (data.valida) {
          keyGuardada = keyVal;
          msg.className = "msg success";
          msg.textContent = "¡Key válida!";
          
          setTimeout(() => {
            document.getElementById("viewKey").classList.add("hidden");
            document.getElementById("viewTool").classList.remove("hidden");
          }, 500);
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "Key no válida o expirada.";
          btn.disabled = false;
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Error al conectar con el servidor.";
        btn.disabled = false;
      }
    }

    function archivoSeleccionado(input) {
      const label = document.getElementById("fileLabel");
      const btn = document.getElementById("btnProcesar");

      if (input.files && input.files[0]) {
        label.textContent = `📄 ${input.files[0].name}`;
        btn.disabled = false;
      } else {
        label.textContent = "📁 Seleccionar archivo";
        btn.disabled = true;
      }
    }

    async function procesarArchivo() {
      const fileInput = document.getElementById("fileInput");
      const btn = document.getElementById("btnProcesar");
      const msg = document.getElementById("msgTool");

      if (!fileInput.files[0] || !keyGuardada) return;

      const formData = new FormData();
      formData.append("key", keyGuardada);
      formData.append("file", fileInput.files[0]);

      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Procesando archivo...";

      try {
        const response = await fetch(`${API_URL}/modificar-archivo`, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || "Error al modificar archivo.");
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `modificado_${fileInput.files[0].name}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        msg.className = "msg success";
        msg.textContent = "¡Descargado con éxito!";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message || "Ocurrió un error inesperado.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
